name: Auto Render Shorts

on:
  schedule:
    # Berjalan setiap 6 jam sekali agar stok video di Uplotan selalu ada
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Jalankan Robot Render (Via Proyek B)
        env:
          # --- PERBAIKAN DI SINI: NAMA HARUS TOKEN_DATA_B ---
          TOKEN_DATA_B: ${{ secrets.TOKEN_DATA_B }}
          CLIENT_SECRETS_DATA_B: ${{ secrets.CLIENT_SECRETS_DATA_B }}
          
          # ID Folder
          SOURCE_LIVE_ID: ${{ secrets.SOURCE_LIVE_ID }}
          MUSIC_FOLDER_ID: ${{ secrets.MUSIC_FOLDER_ID }}
          UPLOTAN_FOLDER_ID: ${{ secrets.UPLOTAN_FOLDER_ID }}
          QUOTES_FILE_ID: ${{ secrets.QUOTES_FILE_ID }}
        run: python render_shorts_auto.py
