name: MICRO WILD - Auto Render Shorts

on:
  workflow_dispatch: # Agar muncul tombol "Run workflow" manual
  schedule:
    - cron: '0 */6 * * *' # Berjalan otomatis setiap 6 jam

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install FFmpeg & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Jalankan Skrip Render
        env:
          # Pastikan semua Secret ini sudah Anda isi di Settings
          TOKEN_DATA: ${{ secrets.TOKEN_DATA }}
          SOURCE_LIVE_ID: ${{ secrets.SOURCE_LIVE_ID }}
          MUSIC_FOLDER_ID: ${{ secrets.MUSIC_FOLDER_ID }}
          UPLOTAN_FOLDER_ID: ${{ secrets.UPLOTAN_FOLDER_ID }}
          QUOTES_FILE_ID: ${{ secrets.QUOTES_FILE_ID }}
        # Nama file di bawah ini harus sama dengan file .py Anda
        run: python render_shorts_auto.py