name: Auto Rain Live Stream

on:
  schedule:
    # 15:00 UTC = 22:00 WIB / 23:00 WITA.
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  live_session:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Library
        run: |
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Jalankan Robot Live (Via Proyek B)
        env:
          # Diarahkan ke TOKEN_DATA_B agar hemat kuota Proyek A
          TOKEN_DATA: ${{ secrets.TOKEN_DATA_B }}
          SOURCE_LIVE_ID: ${{ secrets.SOURCE_LIVE_ID }}
          MUSIC_FOLDER_ID: ${{ secrets.MUSIC_FOLDER_ID }}
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: python auto_live_rain.py
