name: Render Automated Shorts

on:
  schedule:
    # 18:00 UTC = 02:00 WITA
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  render_process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2

     - name: Execute Render
        env:
          TOKEN_DATA: ${{ secrets.TOKEN_DATA }}
          SOURCE_LIVE_ID: ${{ secrets.SOURCE_LIVE_ID }}
          MUSIC_FOLDER_ID: ${{ secrets.MUSIC_FOLDER_ID }}
          UPLOTAN_FOLDER_ID: ${{ secrets.UPLOTAN_FOLDER_ID }}
          QUOTES_FILE_ID: ${{ secrets.QUOTES_FILE_ID }} # Tambahkan baris ini
        run: python render_shorts_auto.py

### Keuntungan Sistem Baru Ini:
1.  **Mudah Diedit:** Anda tinggal buka Google Drive dari HP, edit file `quotes.txt`, tambahkan kata-kata baru, lalu simpan.
2.  **Satu Tempat:** Tidak perlu lagi mencari-cari baris kode di GitHub hanya untuk mengganti satu kata.
3.  **Dinamis:** Robot akan mendownload versi terbaru dari file tersebut setiap kali ia mulai bekerja.

Apakah Anda sudah menemukan ID file `quotes.txt` tersebut untuk dimasukkan ke GitHub Secrets?
