name: Auto Render & Process Shorts

on:
  schedule:
    # Mengatur jadwal render otomatis. 
    # Contoh: '0 18 * * *' berarti jam 02:00 WITA / 01:00 WIB.
    - cron: '0 18 * * *'
  workflow_dispatch: # Memungkinkan menjalankan secara manual dari tab Actions

jobs:
  render_shorts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Jalankan Robot Render
        env:
          # Pastikan semua Secret ini sudah terisi di Settings > Secrets > Actions
          TOKEN_DATA: ${{ secrets.TOKEN_DATA }}
          SOURCE_LIVE_ID: ${{ secrets.SOURCE_LIVE_ID }}
          MUSIC_FOLDER_ID: ${{ secrets.MUSIC_FOLDER_ID }}
          UPLOTAN_FOLDER_ID: ${{ secrets.UPLOTAN_FOLDER_ID }}
          QUOTES_FILE_ID: ${{ secrets.QUOTES_FILE_ID }}
        run: python render_shorts_auto.py
