name: Robot Audio Visualizer (Daily Full Render)

on:
  workflow_dispatch:
  schedule:
    # Berjalan 1x sehari jam 02:00 WITA (18:00 UTC)
    - cron: '0 18 * * *'

jobs:
  render_all:
    runs-on: ubuntu-latest
    # Timeout ditingkatkan menjadi 6 jam (maksimum GitHub) agar bisa merender banyak file sekaligus
    timeout-minutes: 360 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg & Library
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Eksekusi Robot Visualizer (Render Semua)
        env:
          TOKEN_DATA: ${{ secrets.TOKEN_DATA }}
          IMAGE_FOLDER_ID: ${{ secrets.IMAGE_FOLDER_ID }}
          AUDIO_VISUAL_ID: ${{ secrets.AUDIO_VISUAL_ID }}
          UPLOTAN_VISUAL_ID: ${{ secrets.UPLOTAN_VISUAL_ID }}
          PROCESSED_VISUAL_ID: ${{ secrets.PROCESSED_VISUAL_ID }}
          QUOTES_FILE_ID: ${{ secrets.QUOTES_FILE_ID }}
        run: python render_audio_image.py
