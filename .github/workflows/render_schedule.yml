name: Jadwal Render Otomatis (3 Hari Sekali)

on:
  schedule:
    # Menjalankan workflow setiap 3 hari sekali pada jam 00:00 UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch:
    # Memungkinkan untuk menjalankan proses secara manual dari tab Actions

jobs:
  render_job:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kode
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Python Dependencies
      run: |
        pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

    - name: Jalankan Skrip Render
      env:
        # Mengambil data dari GitHub Secrets
        TOKEN_DATA: ${{ secrets.TOKEN_DATA }}
        TOKEN_DATA_B: ${{ secrets.TOKEN_DATA_B }}
        MUSIC_FOLDER_ID: ${{ secrets.MUSIC_FOLDER_ID }}
        UPLOTAN_FOLDER_ID: ${{ secrets.UPLOTAN_FOLDER_ID }}
        QUOTES_FILE_ID: ${{ secrets.QUOTES_FILE_ID }}
      run: python render_Music.py
