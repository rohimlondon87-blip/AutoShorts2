name: Master Otomasi Micro Wild

on:
  # Fitur Tes Manual dengan Pilihan Tugas
  workflow_dispatch:
    inputs:
      pilih_tugas:
        description: 'Pilih tugas yang ingin dijalankan secara manual:'
        required: true
        default: 'upload'
        type: choice
        options:
          - upload
          - render
          - live
          - compile

  schedule:
    # 1. Render Shorts (02:00 WITA = 18:00 UTC)
    - cron: '0 18 * * *'
    
    # 2. Upload Shorts (08, 16, 00 WITA = 00, 08, 16 UTC)
    - cron: '0 0,8,16 * * *'
    
    # 3. Live Streaming (Setiap Senin Jam 09:00 WITA = 01:00 UTC)
    - cron: '0 1 * * 1'
    
    # 4. Kompilasi Video Panjang (Setiap Minggu Jam 03:00 WITA = 19:00 UTC Sabtu)
    - cron: '0 19 * * 6'

jobs:
  automation_task:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Maksimal 6 jam untuk proses render
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2

      # --- TUGAS 1: RENDER SHORTS ---
      - name: Jalankan Render Shorts
        if: |
          (github.event_name == 'workflow_dispatch' && github.event.inputs.pilih_tugas == 'render') || 
          (github.event.schedule == '0 18 * * *')
        env:
          TOKEN_DATA: ${{ secrets.TOKEN_DATA }}
          SOURCE_LIVE_ID: ${{ secrets.SOURCE_LIVE_ID }}
          MUSIC_FOLDER_ID: ${{ secrets.MUSIC_FOLDER_ID }}
          UPLOTAN_FOLDER_ID: ${{ secrets.UPLOTAN_FOLDER_ID }}
          QUOTES_FILE_ID: ${{ secrets.QUOTES_FILE_ID }}
        run: python render_shorts_auto.py

      # --- TUGAS 2: UPLOAD SHORTS ---
      - name: Jalankan Upload Shorts
        if: |
          (github.event_name == 'workflow_dispatch' && github.event.inputs.pilih_tugas == 'upload') || 
          (github.event_name == 'schedule' && contains('0 0,8,16 * * *', github.event.schedule))
        env:
          TOKEN_DATA: ${{ secrets.TOKEN_DATA }}
          CLIENT_SECRETS_DATA: ${{ secrets.CLIENT_SECRETS_DATA }}
          UPLOTAN_FOLDER_ID: ${{ secrets.UPLOTAN_FOLDER_ID }}
          PROCESSED_FOLDER_ID: ${{ secrets.SHORT_SELESAI_ID }}
        run: python auto_shorts.py

      # --- TUGAS 3: LIVE STREAMING ---
      - name: Jalankan Live Stream
        if: |
          (github.event_name == 'workflow_dispatch' && github.event.inputs.pilih_tugas == 'live') || 
          (github.event.schedule == '0 1 * * 1')
        env:
          TOKEN_DATA: ${{ secrets.TOKEN_DATA_B }}
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          SOURCE_LIVE_ID: ${{ secrets.SOURCE_LIVE_ID }}
          MUSIC_FOLDER_ID: ${{ secrets.MUSIC_FOLDER_ID }}
        run: python auto_live_rain.py

      # --- TUGAS 4: KOMPILASI VIDEO PANJANG ---
      - name: Jalankan Kompilasi Video
        if: |
          (github.event_name == 'workflow_dispatch' && github.event.inputs.pilih_tugas == 'compile') || 
          (github.event.schedule == '0 19 * * 6')
        env:
          TOKEN_DATA: ${{ secrets.TOKEN_DATA }}
          input_video_id: ${{ secrets.input_video_id }}
          Gabungan_short_id: ${{ secrets.Gabungan_short_id }}
          Selesai_render_short_id: ${{ secrets.Selesai_render_short_id }}
          MUSIC_FOLDER_ID: ${{ secrets.MUSIC_FOLDER_ID }}
        run: python auto_compile_long.py
