name: MICRO WILD - Automated System

on:
  schedule:
    - cron: '0 18 * * *' # Render jam 2 pagi WITA
    - cron: '0 22,0,2,4,6,8,10,12,14,16 * * *' # Upload setiap 2 jam
    - cron: '0 7 * * *'   # Live jam 3 sore WITA
  workflow_dispatch:
    inputs:
      pilih_tugas:
        description: 'Pilih tugas yang ingin dijalankan sekarang:'
        required: true
        default: 'upload'
        type: choice
        options:
          - upload
          - render
          - live

jobs:
  task:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Tools & 3D Fonts
        run: |
          sudo apt-get update
          
          # [PENTING] Terima lisensi font Microsoft otomatis agar instalasi tidak macet
          echo ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true | sudo debconf-set-selections
          
          # Install FFmpeg dan Font Comic Sans
          sudo apt-get install -y ffmpeg fonts-dejavu-core ttf-mscorefonts-installer fontconfig
          sudo fc-cache -f -v
          
          # Install Library Python
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2
          
      - name: Execute Robot
        env:
          TOKEN_DATA: ${{ secrets.TOKEN_DATA }}
          TOKEN_DATA_B: ${{ secrets.TOKEN_DATA_B }}
          CLIENT_SECRETS_DATA: ${{ secrets.CLIENT_SECRETS_DATA }}
          CLIENT_SECRETS_DATA_B: ${{ secrets.CLIENT_SECRETS_DATA_B }}
          SOURCE_LIVE_ID: ${{ secrets.SOURCE_LIVE_ID }}
          MUSIC_FOLDER_ID: ${{ secrets.MUSIC_FOLDER_ID }}
          UPLOTAN_FOLDER_ID: ${{ secrets.UPLOTAN_FOLDER_ID }}
          PROCESSED_FOLDER_ID: ${{ secrets.PROCESSED_FOLDER_ID }}
          QUOTES_FILE_ID: ${{ secrets.QUOTES_FILE_ID }}
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          # JIKA DIJALANKAN SECARA MANUAL (KLIK TOMBOL)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Menjalankan tugas manual: ${{ github.event.inputs.pilih_tugas }}"
            if [[ "${{ github.event.inputs.pilih_tugas }}" == "render" ]]; then
              python render_shorts.py
            elif [[ "${{ github.event.inputs.pilih_tugas }}" == "live" ]]; then
              python auto_live_rain.py
            else
              python upload_shorts.py
            fi
            
          # JIKA DIJALANKAN OTOMATIS OLEH JADWAL (CRON)
          else
            if [[ "${{ github.event.schedule }}" == "0 18 * * *" ]]; then
              python render_shorts.py
            elif [[ "${{ github.event.schedule }}" == "0 7 * * *" ]]; then
              python auto_live_rain.py
            else
              python upload_shorts.py
            fi
          fi
