name: Master Otomasi Micro Wild

on:
  workflow_dispatch: # Memungkinkan menjalankan manual jika perlu
  schedule:
    # 1. Render Shorts (02:00 WITA = 18:00 UTC)
    - cron: '0 18 * * *'
    
    # 2. Upload Shorts (08, 16, 00 WITA = 00, 08, 16 UTC)
    - cron: '0 0,8,16 * * *'
    
    # 3. Live Stream Senin (09:00 WITA = 01:00 UTC)
    - cron: '0 1 * * 1'

jobs:
  automation:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Maksimal 6 jam untuk proses render besar
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2

      # --- LOGIKA 1: RENDER SHORTS (1x Sehari jam 02:00 WITA) ---
      - name: Jalankan Render Shorts
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 18 * * *'
        env:
          TOKEN_DATA: ${{ secrets.TOKEN_DATA }}
          SOURCE_LIVE_ID: ${{ secrets.SOURCE_LIVE_ID }}
          MUSIC_FOLDER_ID: ${{ secrets.MUSIC_FOLDER_ID }}
          UPLOTAN_FOLDER_ID: ${{ secrets.UPLOTAN_FOLDER_ID }}
          PROCESSED_FOLDER_ID: ${{ secrets.PROCESSED_FOLDER_ID }}
          QUOTES_FILE_ID: ${{ secrets.QUOTES_FILE_ID }}
        run: python render_shorts.py

      # --- LOGIKA 2: UPLOAD SHORTS (3x Sehari jam 08, 16, 00 WITA) ---
      - name: Jalankan Upload Shorts
        if: github.event_name == 'workflow_dispatch' || contains('0 0,8,16 * * *', github.event.schedule)
        env:
          TOKEN_DATA: ${{ secrets.TOKEN_DATA }}
          CLIENT_SECRETS_DATA: ${{ secrets.CLIENT_SECRETS_DATA }}
          UPLOTAN_FOLDER_ID: ${{ secrets.UPLOTAN_FOLDER_ID }}
          PROCESSED_FOLDER_ID: ${{ secrets.PROCESSED_FOLDER_ID }}
        run: python auto_shorts.py

      # --- LOGIKA 3: LIVE STREAM (Setiap Senin jam 09:00 WITA) ---
      - name: Jalankan Live Streaming
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 1 * * 1'
        env:
          TOKEN_DATA: ${{ secrets.TOKEN_DATA }}
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          SOURCE_LIVE_ID: ${{ secrets.SOURCE_LIVE_ID }}
        run: python auto_live_rain.py