name: Auto Upload Shorts (Dual Token - 10x Daily)

on:
  schedule:
    # Jadwal 10x dalam 24 jam (Waktu UTC)
    # UTC: 22, 00, 02, 04, 06, 08, 10, 12, 14, 16
    # WITA: 06, 08, 10, 12, 14, 16, 18, 20, 22, 00
    - cron: '0 22,0,2,4,6,8,10,12,14,16 * * *'
  workflow_dispatch: # Memungkinkan upload manual tambahan

jobs:
  upload_process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Jalankan Robot Dual Token
        env:
          # Kunci A (Proyek 1)
          CLIENT_SECRETS_DATA: ${{ secrets.CLIENT_SECRETS_DATA }}
          TOKEN_DATA: ${{ secrets.TOKEN_DATA }}
          # Kunci B (Proyek 2)
          CLIENT_SECRETS_DATA_B: ${{ secrets.CLIENT_SECRETS_DATA_B }}
          TOKEN_DATA_B: ${{ secrets.TOKEN_DATA_B }}
          # Folder Drive
          UPLOTAN_FOLDER_ID: ${{ secrets.UPLOTAN_FOLDER_ID }}
          PROCESSED_FOLDER_ID: ${{ secrets.SPROCESSED_FOLDER_ID }}
        run: python auto_shorts.py
