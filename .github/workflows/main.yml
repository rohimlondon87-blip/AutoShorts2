name: Auto Shorts Uploader

on:
  schedule:
    # Berjalan 6 kali sehari (Setiap 4 jam)
    # Jam 22, 2, 6, 10, 14, 18 UTC 
    # Sama dengan Jam 5, 9, 13, 17, 21, 1 WIB
    - cron: '0 2,6,10,14,18,22 * * *'
  workflow_dispatch:      # Tombol untuk menjalankan manual

jobs:
  run_bot:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil Kode
        uses: actions/checkout@v3

      - name: Install FFmpeg (Wajib untuk MoviePy)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Library
        run: pip install google-api-python-client google-auth-oauthlib google-auth-httplib2 google-generativeai moviepy==1.0.3

      - name: Jalankan Robot
        env:
          CLIENT_SECRETS_DATA: ${{ secrets.CLIENT_SECRETS_DATA }}
          TOKEN_DATA: ${{ secrets.TOKEN_DATA }}
          SOURCE_FOLDER_ID: ${{ secrets.SOURCE_FOLDER_ID }}
          PROCESSED_FOLDER_ID: ${{ secrets.PROCESSED_FOLDER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_PRIVACY: ${{ secrets.YOUTUBE_PRIVACY }}
        run: python auto_shorts.py
