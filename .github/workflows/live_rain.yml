      - name: Run Robot Live
        env:
          TOKEN_DATA: ${{ secrets.TOKEN_DATA }}
          CLIENT_SECRETS_DATA: ${{ secrets.CLIENT_SECRETS_DATA }}
          SOURCE_LIVE_ID: ${{ secrets.SOURCE_LIVE_ID }}
          MUSIC_FOLDER_ID: ${{ secrets.MUSIC_FOLDER_ID }}
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: python auto_live_rain.py

**Penjelasan:**
* Jika baris `TOKEN_DATA: ${{ secrets.TOKEN_DATA }}` tidak ada di file `.yml`, maka script Python **tidak akan pernah bisa** membaca token tersebut, meskipun Secret-nya sudah Anda buat di GitHub.
* Script terbaru di atas juga sudah saya bekali dengan "pencari otomatis", jadi jika Anda menamainya `TOKEN_DATA_B` tapi script mencari `TOKEN_DATA`, dia akan mencoba menemukannya sendiri.

Silakan perbarui file `auto_live_rain.py` dan pastikan file `.yml` Anda sudah mengirimkan Secret ke environment Python. Beritahu saya hasilnya!
